name: BlackMoonKernelStaticLib release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      modern_core_ref:
        description: 'ycIDE-electron commit or tag used for the x64 ABI fallback and FNE metadata'
        required: false
        default: 'a1e45277fef25ac7480f40d66083aef31a924944'

permissions:
  contents: write

concurrency:
  group: blackmoon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-vc6:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout BlackMoonKernelStaticLib
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate VC6 DSP source list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vc6
          awk -F= '/^SOURCE=.*\.cpp"/ { source = $2; gsub(/"/, "", source); print source }' \
            Project/krnln_VC6.dsp > artifacts/vc6/sources.lst
          test "$(wc -l < artifacts/vc6/sources.lst)" -eq 237

      - name: Verify VC6 container tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine --version && test -f /opt/vc/BIN/CL.EXE && test -f /opt/vc/BIN/LIB.EXE && test -d /opt/vc/INCLUDE && test -d /opt/vc/LIB'

      - name: Build VC6 krnln release library
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine cmd /c "call Z:\\workspace\\scripts\\BuildBlackMoonVc6.cmd"'

      - name: Verify VC6 output
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/vc6/krnln.lib
          test "$(find artifacts/vc6/obj -maxdepth 1 -type f -name '*.obj' | wc -l)" -eq 237

      - name: Package VC6 release library
        id: vc6_package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION:-local}"
          safe_version="$(printf '%s' "$release_version" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          package_name="BlackMoonKernelStaticLib-${safe_version}-vc6.zip"
          package_root="artifacts/vc6/package"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          cp artifacts/vc6/krnln.lib "$package_root/krnln.lib"
          cp LICENSE "$package_root/LICENSE"
          sha256="$(sha256sum "$package_root/krnln.lib" | awk '{print $1}')"
          bytes="$(stat -c '%s' "$package_root/krnln.lib")"
          jq -n \
            --arg version "$release_version" \
            --arg revision "$REVISION" \
            --arg sha256 "$sha256" \
            --arg container 'giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af' \
            --argjson bytes "$bytes" \
            '{formatVersion: 1, product: "BlackMoonKernelStaticLib", version: $version, architecture: "x86", compiler: "Visual C++ 6.0", configuration: "Release", workspace: "krnln_VC6.dsw", sourceProject: "Project/krnln_VC6.dsp", containerImage: $container, revision: $revision, files: {"krnln.lib": {sha256: $sha256, bytes: $bytes}}}' \
            > "$package_root/blackmoon-vc6-package.json"
          printf '%s\n' \
            '# BlackMoonKernelStaticLib VC6 release' \
            '' \
            'This archive contains the Win32 krnln.lib built with Visual C++ 6.0.' \
            'See blackmoon-vc6-package.json for the pinned build environment and file hash.' \
            > "$package_root/README.md"
          (
            cd "$package_root"
            zip -q -9 "../$package_name" krnln.lib LICENSE README.md blackmoon-vc6-package.json
          )
          test -s "artifacts/vc6/$package_name"
          "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Upload VC6 release package for publishing
        uses: actions/upload-artifact@v4
        with:
          name: blackmoon-vc6-release-package
          path: artifacts/vc6/${{ steps.vc6_package.outputs.package_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-release:
    needs: build-vc6
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout BlackMoonKernelStaticLib
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The modern core is an explicit build input, not a machine-local path.
      # Its source supplies the x64-compatible fallback and the matching FNE
      # metadata used by the adapter manifest.
      - name: Checkout modern core dependency
        uses: actions/checkout@v4
        with:
          repository: chungbinb/ycIDE-electron
          ref: ${{ inputs.modern_core_ref || 'a1e45277fef25ac7480f40d66083aef31a924944' }}
          path: dependencies/ycIDE-electron
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build both architectures and create packages
        shell: pwsh
        run: |
          # Keep PowerShell/GitHub log transport UTF-8 while the project and
          # legacy adapter explicitly handle CP936 input sources.
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          cmd.exe /c 'chcp 936>nul'
          $releaseVersion = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { 'local' }
          & "$PWD\scripts\BuildBlackMoonRelease.ps1" `
            -ModernCoreRoot "$PWD\dependencies\ycIDE-electron" `
            -MetadataRoot "$PWD\dependencies\ycIDE-electron" `
            -Version $releaseVersion `
            -OutputRoot "$PWD\artifacts\release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download VC6 release package
        uses: actions/download-artifact@v4
        with:
          name: blackmoon-vc6-release-package
          path: artifacts/release

      - name: Resolve release packages
        id: release_packages
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $PWD 'artifacts\release'
          $manifestPath = Join-Path $releaseRoot 'blackmoon-package.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "release manifest not found: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'release manifest has no version'
          }

          $safeVersion = $version -replace '[^A-Za-z0-9_.-]', '-'
          $baseName = "BlackMoonKernelStaticLib-$safeVersion"
          $expectedPackages = [ordered]@{
            combined = "$baseName.zip"
            x86 = "$baseName-x86.zip"
            x64 = "$baseName-x64.zip"
            vc6 = "$baseName-vc6.zip"
          }
          $expectedNames = @($expectedPackages.Values | ForEach-Object { [string]$_ })
          $actualPackages = @(Get-ChildItem -LiteralPath $releaseRoot -Filter 'BlackMoonKernelStaticLib-*.zip' -File |
            Sort-Object Name)
          $missing = @($expectedNames | Where-Object { -not (Test-Path -LiteralPath (Join-Path $releaseRoot $_) -PathType Leaf) })
          $unexpected = @($actualPackages | Where-Object { $_.Name -notin $expectedNames })

          if ($actualPackages.Count -ne 4 -or $missing.Count -gt 0 -or $unexpected.Count -gt 0) {
            $found = if ($actualPackages.Count -gt 0) { $actualPackages.Name -join ', ' } else { '<none>' }
            throw "expected release ZIPs: $($expectedNames -join ', '); found: $found"
          }

          foreach ($package in $expectedPackages.GetEnumerator()) {
            "$($package.Key)=artifacts/release/$($package.Value)" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Release packages: $($expectedNames -join ', ')"

      - name: Resolve release channel
        id: release_channel
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          # BuildBlackMoonRelease.ps1 applies the same SemVer/legacy-label
          # rule to the package manifest.  Read that value instead of keeping
          # a second, potentially divergent tag parser in this workflow.
          $manifestPath = Join-Path $PWD 'artifacts\release\blackmoon-package.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "release manifest not found: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $tag) {
            throw "release manifest version '$($manifest.version)' does not match tag '$tag'"
          }
          if ($null -eq $manifest.prerelease) {
            throw 'release manifest has no prerelease field; refusing to publish an ambiguous channel'
          }
          $isPrerelease = [bool]$manifest.prerelease
          $prerelease = if ($isPrerelease) { 'true' } else { 'false' }
          $makeLatest = if ($isPrerelease) { 'false' } else { 'true' }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag; prerelease=$prerelease; make_latest=$makeLatest"

      # Upload the completed ZIPs directly to the Release; the intermediate
      # artifact only transfers the single VC6 package between isolated jobs.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          make_latest: ${{ steps.release_channel.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release_packages.outputs.combined }}
            ${{ steps.release_packages.outputs.x86 }}
            ${{ steps.release_packages.outputs.x64 }}
            ${{ steps.release_packages.outputs.vc6 }}

name: BlackMoonKernelStaticLib VC6 probe

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vc6-core:
    # Manual diagnostics for the pinned VC6/Wine toolchain used by release.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout BlackMoonKernelStaticLib
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate VC6 DSP source list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vc6
          awk -F= '/^SOURCE=.*\.cpp"/ { source = $2; gsub(/"/, "", source); print source }' \
            Project/krnln_VC6.dsp > artifacts/vc6/sources.lst
          test "$(wc -l < artifacts/vc6/sources.lst)" -eq 237

      - name: Verify VC6 container tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine --version && test -f /opt/vc/BIN/CL.EXE && test -f /opt/vc/BIN/LIB.EXE && test -d /opt/vc/INCLUDE && test -d /opt/vc/LIB'

      - name: Build VC6 krnln release library
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine cmd /c "call Z:\\workspace\\scripts\\BuildBlackMoonVc6.cmd"'

      - name: Verify VC6 output
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/vc6/krnln.lib
          test "$(find artifacts/vc6/obj -maxdepth 1 -type f -name '*.obj' | wc -l)" -eq 237
          find artifacts/vc6 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload VC6 probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackMoonKernelStaticLib-vc6-probe-${{ github.run_id }}
          path: artifacts/vc6
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

name: BlackMoonKernelStaticLib VC6 probe

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vc6-core:
    # Experimental only. The image is not an official Microsoft distribution;
    # keep this separate from tag publishing until the build is verified.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout BlackMoonKernelStaticLib
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify VC6 container tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine --version && test -f /opt/vc/BIN/MSDEV.EXE && test -f /opt/vc/MFC/BIN/MFC42.DLL && test -d /opt/vc/INCLUDE && test -d /opt/vc/LIB'

      - name: Build VC6 krnln release library
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            giulioz/vc6-docker@sha256:dc7f878014f065fe17af5ed758d9a415fe20afcf913170e82052e8c32d3b45af \
            bash -lc 'wine cmd /c "call Z:\\workspace\\scripts\\BuildBlackMoonVc6.cmd"'

      - name: Verify VC6 output
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/vc6/krnln.lib
          find artifacts/vc6 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload VC6 probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackMoonKernelStaticLib-vc6-probe-${{ github.run_id }}
          path: |
            artifacts/vc6
            Release
            Project/Release
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
